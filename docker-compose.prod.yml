# 服装进销存 —— 生产部署（服务器上运行）
# 用法：在仓库根目录放好 .env，然后：
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    container_name: cloth_scan_db
    restart: unless-stopped
    # 2G 小机：限制日志与内存，防止日志无限增长塞满磁盘拖垮数据库
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: cloth
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 设置 DB_PASSWORD}
      POSTGRES_DB: cloth_scan
    volumes:
      - cloth_scan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloth -d cloth_scan"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: cloth_scan_server
    restart: unless-stopped
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cloth:${DB_PASSWORD:?请在 .env 设置 DB_PASSWORD}@db:5432/cloth_scan?schema=public
      JWT_SECRET: ${JWT_SECRET:?请在 .env 设置 JWT_SECRET}
      # 注册邀请码：未设置则关闭注册。把它告诉信任的人才能注册门店。
      REGISTER_CODE: ${REGISTER_CODE:?请在 .env 设置 REGISTER_CODE}
      PORT: "3000"
      # 生产标记：seed.ts 据此拒绝在生产库执行（否则容器内 ts-node 可造出弱口令账号）
      NODE_ENV: production
      # 日志时间戳用北京时间（报表切日已在代码内固定 UTC+8，这里只影响日志观感）
      TZ: Asia/Shanghai
      # 建档识图（可选）。不配则 AI 入库返回 503，服务仍启动
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      GARMENT_VISION_MODEL: ${GARMENT_VISION_MODEL:-qwen3-vl-plus}
      # 「查看我的密码」可逆副本密钥（64 位 hex）。不配则该功能降级（不写副本、查询返回 null）
      PASSWORD_CIPHER_KEY: ${PASSWORD_CIPHER_KEY:-}
    healthcheck:
      # health 在 db 不可用时返回 503，可被 docker/监控捕获
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:3000/api/v1/health'').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    ports:
      - "3000:3000"
    volumes:
      # 上传的图片持久化，避免重建容器丢失
      - cloth_scan_uploads:/app/apps/server/uploads
      # APK 下载目录：把新包放到服务器主机 ./apk/app.apk 即可对外下载（/download）
      - ./apk:/app/apps/server/download

volumes:
  cloth_scan_pgdata:
  cloth_scan_uploads:
